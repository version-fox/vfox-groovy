name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-go:
    if: github.repository == 'version-fox/vfox-groovy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: tests/e2e
      - name: Run go vet
        run: go vet ./...
        working-directory: tests/e2e
      - name: Run go vet for Windows
        run: GOOS=windows go vet ./...
        working-directory: tests/e2e
      - name: Run unit tests
        run: go test -short ./...
        working-directory: tests/e2e

  lint-lua:
    if: github.repository == 'version-fox/vfox-groovy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5
      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .
      - name: Check Lua
        run: mise x aqua:LuaLS/lua-language-server@3.19.1 -- lua-language-server --check . --checklevel=Warning

  lint-workflows:
    if: github.repository == 'version-fox/vfox-groovy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check the workflows
        run: actionlint

  check-docs:
    if: github.repository == 'version-fox/vfox-groovy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Every English document has its Chinese counterpart, and the other way
      # round: README.md and README_CN.md, docs/*.md and docs/zh-CN/*.md.
      - name: Check the Chinese and English documents pair up
        run: |
          status=0
          for doc in README.md docs/*.md; do
            case "$doc" in
              README.md) chinese=README_CN.md ;;
              *) chinese="docs/zh-CN/${doc#docs/}" ;;
            esac
            [ -f "$chinese" ] || { echo "missing Chinese counterpart of $doc: $chinese"; status=1; }
          done
          for doc in README_CN.md docs/zh-CN/*.md; do
            case "$doc" in
              README_CN.md) english=README.md ;;
              *) english="docs/${doc#docs/zh-CN/}" ;;
            esac
            [ -f "$english" ] || { echo "missing English counterpart of $doc: $english"; status=1; }
          done
          exit $status
